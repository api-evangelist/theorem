name: Theorem
description: 'Theorem builds machine-learning-powered credit underwriting infrastructure
  for consumer debt markets. Since 2014 the company has priced and purchased billions
  of dollars in loan volume, powering one of the longest-running investment programs
  in the market. Its products deliver instant, API-driven credit assessments to lending
  originators (Custom Loan Integration Programs, or CLIP), score default risk down
  to individual loan cashflows (Theorem Loan Score, or TLS), and package loans into
  credit products for capital-market investors (Securitization as a Service). The API
  is a private, partner-onboarded B2B integration arranged through the partnerships
  team; there is no public developer portal, published OpenAPI specification, or self-service
  sign-up. Theorem is backed by Initialized Capital and operates from Silicon Valley,
  New York City, and Dallas.'
